# La corsa notturna di manutenzione. Fa due cose, in due endpoint distinti.
#
# **Ricalcolo dei conflitti** (ARCHITECTURE.md §6.4 punto 4).
# Non è il meccanismo ordinario: i conflitti si ricalcolano a ogni salvataggio
# di una data. Questo serve a recuperare le derive — un ricalcolo fallito in
# silenzio, un raggio predefinito cambiato, una scheda artista unita da un
# moderatore. È idempotente: rilanciarlo non fa danni.
#
# Nessuno scheduler acceso da qualche parte (ADR-0013): una GitHub Action
# chiama un endpoint protetto da un segreto condiviso.
#
# Dalla Fase 5 la stessa corsa notturna fa anche la pulizia dei dati con una
# scadenza (`/api/cron/purge`, ADR-0032). Due endpoint distinti e non uno solo,
# perché ricalcolare e cancellare sono cose diverse e un ricalcolo che cancella
# righe è la sorpresa che nessuno vuole trovare mesi dopo; un solo workflow,
# perché aggiungere uno scheduler per un `curl` sarebbe il contrario di ADR-0013.
#
# Secret richiesti:
#   APP_URL      indirizzo dell'applicazione, senza barra finale
#   CRON_SECRET  lo stesso valore della variabile d'ambiente sul server
name: Manutenzione notturna

on:
  schedule:
    # Ogni notte alle 03:41 UTC. Minuto non tondo: gli scheduler di GitHub
    # sono congestionati allo scoccare dell'ora, e un job che parte con
    # quaranta minuti di ritardo qui non se ne accorge nessuno.
    - cron: '41 3 * * *'
  workflow_dispatch:

jobs:
  ricalcola:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama /api/cron/recompute
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL" || { echo "APP_URL mancante"; exit 1; }
          test -n "$CRON_SECRET" || { echo "CRON_SECRET mancante"; exit 1; }

          # `--fail-with-body` e non `--fail`: se il server risponde 4xx o 5xx
          # il job deve fallire, ma il corpo della risposta è l'unica cosa che
          # dice perché.
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header 'content-length: 0' \
            "$APP_URL/api/cron/recompute"
          echo

      - name: Chiama /api/cron/purge
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header 'content-length: 0' \
            "$APP_URL/api/cron/purge"
          echo

      # Solleciti sulle date opzionate scadute e ritentativo delle email
      # rimaste in coda (Fase 6, ADR-0036). Dopo `purge` e non prima: se una
      # riga sta per scadere, non ha senso provare a spedirla.
      - name: Chiama /api/cron/notify
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header 'content-length: 0' \
            "$APP_URL/api/cron/notify"
          echo
