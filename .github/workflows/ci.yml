name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Test unitari
        run: npm test

      # Gli smoke test Playwright **non** girano qui, ed è una scelta.
      #
      # Hanno bisogno di un database vero e del ruolo di servizio di Supabase
      # per creare gli utenti di prova: metterli in CI vorrebbe dire dare a
      # ogni pull request — comprese quelle di un fork — la chiave che apre
      # l'intero database (ADR-0038). Si lanciano da locale con
      # `npm run test:e2e`, prima di un rilascio, e ripuliscono da soli.

      - name: Build
        run: npm run build
        env:
          # Il build non tocca il database: bastano valori sintetici perché
          # `$env/dynamic/*` non viene risolto in fase di build.
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
